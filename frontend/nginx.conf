server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space: any path that isn't a real file falls back
    # to index.html, so a hard refresh on /results/<id> loads the app instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. The bundle uses relative URLs, so nothing about the API's
    # hostname is baked in at build time and the browser never sees a cross-origin
    # request (no CORS preflight, no VITE_API_BASE_URL to get wrong).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/jobs/{id}/stream is a WebSocket; these two headers are what let it
        # upgrade instead of being served as a dead HTTP request.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # The progress stream is idle between polls and exports can take a while --
        # the 60s default would cut both off mid-job.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # FastAPI's interactive docs, same origin so the "Authorize" flow works.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets are immutable; index.html must never be cached or a
    # deploy leaves browsers pointing at asset filenames that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
