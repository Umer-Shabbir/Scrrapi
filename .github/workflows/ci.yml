name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    # Settings are required fields with no defaults, so importing app.main at
    # collection time needs them present. These are throwaway CI values -- the
    # suite never opens a connection (no DB-backed tests yet).
    env:
      APP_DB_URL: postgresql+psycopg://leadgen:leadgen@localhost:5434/leadgen_app
      GEO_DB_URL: postgresql+psycopg://leadgen:leadgen@localhost:5433/leadgen_geo
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        # Playwright's Python package is enough to import; browsers are only
        # needed for live scraping, which is deliberately out of CI.
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
